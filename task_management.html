<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager Dashboard | AuraArts</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <main class="dashboard-container">
        <div class="dashboard-header">
            <h1><i class="fas fa-tasks"></i> Studio Task Manager</h1>
        </div>

        <div class="task-input-group">
            <input type="text" id="taskInput" placeholder="Add a new studio assignment... (e.g., Finish Canvas Sketch)">
            <button class="btn-add" id="addTaskBtn"><i class="fas fa-plus"></i> Add</button>
        </div>

        <div class="filter-group">
            <input type="text" id="searchBar" placeholder="Search assignments by name...">
            <select id="filterStatus">
                <option value="all">All Assignments</option>
                <option value="pending">Pending</option>
                <option value="completed">Completed</option>
            </select>
        </div>

        <ul id="taskList" class="task-list"></ul>
    </main>

    <script src="js/tasks.js"></script>
</body>
</html>
